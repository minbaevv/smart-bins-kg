<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Bins KG — карта баков</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Smart Bins KG</h1>
      <p class="subtitle">Мониторинг заполненности мусорных баков</p>
    </div>
    <div class="legend">
      <span><i class="dot green"></i> пусто</span>
      <span><i class="dot yellow"></i> наполовину</span>
      <span><i class="dot red"></i> полно</span>
      <span><i class="dot grey"></i> нет данных</span>
    </div>
  </header>

  <section class="controls">
    <label><input type="checkbox" id="only-red" /> только красные</label>
    <label><input type="checkbox" id="only-offline" /> без связи</label>
    <span id="summary" class="summary">загрузка…</span>
    <span id="updated" class="updated"></span>
  </section>

  <main>
    <div id="map"></div>
    <aside>
      <h2>Баки</h2>
      <ul id="bin-list" class="bin-list"></ul>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
